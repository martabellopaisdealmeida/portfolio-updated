      justify-content: space-between;

    }

    .logo {

      align-items: center;

    }

    .logo-link { text-decoration: none; }

      font-size: 1.375em;
      color: #333;
      text-decoration: none;
      font-style: italic;
    }

    .header-top-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 0;
      font-family: 'ABCDiatypeMono', monospace;
      font-size: 1.125em;
      font-weight: 300;

      color: #333;
      font-weight: 300;

      margin-right: 0.375em;

      font-weight: 300;
      font-style: italic;
    }

    .search-container { cursor: pointer; }

      font-family: 'ExposureItalic-70', 'PPMori', sans-serif;
      font-size: 1.375em;
      font-style: italic;
      color: #333;
      transition: color 0.2s ease;
    }

    /* Toggle */
    .theme-toggle {
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .toggle-switch {
      position: relative;
      width: 2em;
      height: 1.1875em;
      background-color: #E9E9EA;
      border-radius: 0.59375em;
      cursor: pointer;
      transition: background-color 0.3s ease;
      border: none;
    }

    .toggle-slider {
      position: absolute;
      top: 0.1em;
      left: 0.1em;
      width: 0.9875em;
      height: 0.9875em;
      background-color: #ffffff;
      border-radius: 0.49375em;
      transition: transform 0.3s ease;
      box-shadow: 0 0.15em 0.35em rgba(0,0,0,0.12);
    }

    body.dark-mode .toggle-slider { transform: translateX(0.8125em); }
    body.dark-mode .toggle-switch { background-color: #BBBBBB; }

    body.dark-mode {
      background-color: #000;
      color: #fff;
    }

    body.dark-mode .logo-text,
    body.dark-mode .desktop-nav a,
    body.dark-mode .search-text,
    body.dark-mode .footer-left p,
    body.dark-mode .footer-right a { color: #ffffff; }

    body.dark-mode .footer-line,
    body.dark-mode .footer-line-mobile { background-color: #ffffff; }

    body.dark-mode .get-in-text-top,
    body.dark-mode .get-in-text-bottom,
    body.dark-mode .get-in-text-top-mobile,
    body.dark-mode .get-in-text-bottom-mobile { color: #ffffff; }

    body.dark-mode header {
      background-color: rgba(0,0,0,0.95);
    }

    /* ==================== SCATTER STAGE ==================== */
    .scatter-stage {
      position: relative;
      width: 100%;
      /* tall enough to contain all rects — will be sized by JS */
      min-height: 100vh;
      overflow: hidden;
    }

    /* ==================== RECTANGLE ITEMS ==================== */
    .rect-item {
      position: absolute;
      border: none;
      overflow: hidden;
      cursor: pointer;
    }

    .rect-item:hover {
      z-index: 10;
    }

    /* The image inside — hidden by default */
    .rect-item img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      /* fade out slow + delay = trail/ghost effect */
      transition: opacity 0.9s ease 0.35s;
      display: block;
    }

    .rect-item:hover img {
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    /* Project label */
    .rect-item .rect-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 6px 8px;
      font-family: 'ABCDiatypeMono', monospace;
      font-size: 9px;
      font-weight: 300;
      color: #fff;
      background: rgba(0,0,0,0.55);
      opacity: 0;
      transition: opacity 0.7s ease 0.2s;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rect-item:hover .rect-label {
      opacity: 1;
      transition: opacity 0.15s ease 0.1s;
    }

    /* Decorative rects — fully invisible, no cursor change */
    .rect-item.deco {
      cursor: default;
    }

    footer {

      bottom: 0;
      left: 0;
      right: 0;

      padding: 0 5.625em;
      z-index: 1000;

      align-items: flex-end;
      padding-bottom: 1.875em;
      overflow: visible;

    .interactive-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 100%;
      position: relative;
      overflow: visible;
    }

      font-size: 0.875em;
      font-weight: 300;
      margin: 0;
      font-family: 'ABCDiatypeMono', monospace;

    .footer-right a {

      font-size: 0.875em;
      font-weight: 300;
      transition: opacity 0.2s ease;
      font-family: 'ABCDiatypeMono', monospace;

    .footer-right a:hover { opacity: 0.7; }

    .footer-center {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9375em;
      text-decoration: none;
      color: inherit;
      padding: 1.25em 0;
    }

    .footer-line {
      width: 31.25em;
      height: 0.3125em;
      background-color: #333;
      transition: all 0.2s ease;

    .get-in-text-top,

      color: #333;
      opacity: 0;

    }

    const W = stage.offsetWidth;
    // Use a tall stage — compute from max y + max h
    const maxY = rects.reduce((m, r) => Math.max(m, r.y + r.h), 0);
    // Stage height: map % to px using viewport height as base
    const H = window.innerHeight * 0.92;
    stage.style.height = H + 'px';

    rects.forEach(function(r) {
      const el = document.createElement('a');
      const proj = r.p !== null ? projects[r.p % projects.length] : null;

      el.className = 'rect-item' + (proj ? '' : ' deco');
      el.href = proj ? proj.url : '#';
      if (!proj) { el.addEventListener('click', e => e.preventDefault()); }

      // Position as % of W and H
      el.style.left   = (r.x / 100 * W) + 'px';
      el.style.top    = (r.y / 100 * H) + 'px';
      el.style.width  = (r.w / 100 * W) + 'px';
      el.style.height = (r.h / 100 * H) + 'px';

      if (proj) {
        const img = document.createElement('img');
        img.src = proj.img;
        img.alt = proj.name;
        img.loading = 'lazy';
        el.appendChild(img);

        const label = document.createElement('div');
        label.className = 'rect-label';
        label.textContent = proj.name;
        el.appendChild(label);
      }

      stage.appendChild(el);
    });
  }

  // Build on load
  buildScatter();

  // Rebuild on resize (debounced)
  let resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      stage.innerHTML = '';
      buildScatter();
    }, 200);
  });

  // ==================== DARK MODE TOGGLE ====================
  const toggleSwitch = document.querySelector('.toggle-switch');
  const body = document.body;
  const currentTheme = localStorage.getItem('theme') || 'light';
  if (currentTheme === 'dark') body.classList.add('dark-mode');

  if (toggleSwitch) {
    toggleSwitch.addEventListener('click', function() {
      body.classList.toggle('dark-mode');
      localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
    });
  }
  </script>

</body>
</html>
