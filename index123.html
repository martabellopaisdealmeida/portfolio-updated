  // ============================================================
  //  ENGINE
  // ============================================================

  const stage = document.getElementById('scatter-stage');
  let rectElements = [];
  let currentImages = [];
  let MOODBOARD_IMAGES = [];  // preenchido via GitHub API

  // Fisher-Yates shuffle
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Distribute images across rects (cycling if fewer images than rects)
  function assignImages() {
    const shuffled = shuffle(MOODBOARD_IMAGES);
    return RECTS.map((_, i) => shuffled[i % shuffled.length]);
  }

  function buildScatter() {
    stage.innerHTML = '';
    rectElements = [];

    const W = stage.offsetWidth;
    const H = window.innerHeight * 0.92;
    stage.style.height = H + 'px';

    currentImages = assignImages();

    RECTS.forEach(function(r, i) {
      const el = document.createElement('div');
      el.className = 'rect-item';
      el.style.left   = (r.x / 100 * W) + 'px';
      el.style.top    = (r.y / 100 * H) + 'px';
      el.style.width  = (r.w / 100 * W) + 'px';
      el.style.height = (r.h / 100 * H) + 'px';

      const img = document.createElement('img');
      img.src = currentImages[i];
      img.alt = '';
      img.loading = 'lazy';
      el.appendChild(img);

      stage.appendChild(el);
      rectElements.push(el);
    });
  }

  // Swap image in a rect — silent if not hovered, crossfade if hovered
  function swapImage(rectIndex, newSrc) {
    const el = rectElements[rectIndex];
    if (!el) return;
    const img = el.querySelector('img');
    if (!img) return;

    if (el.matches(':hover')) {
      const clone = img.cloneNode();
      clone.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;transition:opacity 0.6s ease;';
      el.appendChild(clone);
      img.src = newSrc;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        clone.style.opacity = '0';
        setTimeout(() => clone.parentNode && clone.parentNode.removeChild(clone), 700);
      }));
    } else {
      img.src = newSrc;
    }

    currentImages[rectIndex] = newSrc;
  }

  // Rotation loop
  function startRotation() {
    setInterval(() => {
      if (MOODBOARD_IMAGES.length < 2) return;
      const indices = shuffle([...Array(RECTS.length).keys()]).slice(0, RECTS_PER_ROTATION);
      indices.forEach(idx => {
        const current = currentImages[idx];
        const pool = MOODBOARD_IMAGES.filter(src => src !== current);
        if (!pool.length) return;
        swapImage(idx, pool[Math.floor(Math.random() * pool.length)]);
      });
    }, ROTATION_INTERVAL);
  }

  // ============================================================
  //  GITHUB API — vai buscar a lista de imagens da pasta
  // ============================================================
  async function loadImagesFromGitHub() {
    const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FOLDER}?ref=${GITHUB_BRANCH}`;


    
    try {
      const res = await fetch(apiUrl, {
        headers: { 'Accept': 'application/vnd.github.v3+json' }
      });

      if (!res.ok) throw new Error(`GitHub API: ${res.status}`);

      const files = await res.json();

      // Filtra só imagens e constrói URLs de raw content
      MOODBOARD_IMAGES = files
        .filter(f => {
          const ext = f.name.split('.').pop().toLowerCase();
          return f.type === 'file' && IMAGE_EXTS.includes(ext);
        })
        .map(f => `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${f.path}`);

      if (MOODBOARD_IMAGES.length === 0) {
        console.warn('Nenhuma imagem encontrada na pasta:', GITHUB_FOLDER);
        return;
      }

      console.log(`${MOODBOARD_IMAGES.length} imagens carregadas do GitHub`);

      buildScatter();
      startRotation();

    } catch (err) {
      console.error('Erro ao carregar imagens do GitHub:', err);
      // Fallback: não mostra nada (página fica limpa — as zones invisíveis continuam)
    }
  }

  // Inicia
  loadImagesFromGitHub();

  // Rebuild on resize (debounced)
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (MOODBOARD_IMAGES.length) buildScatter(); }, 200);
