    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
  
    function assignImages() {
      const shuffled = shuffle(MOODBOARD_IMAGES);
      return RECTS.map((_, i) => shuffled[i % shuffled.length]);
    }
  
    function createMediaElement(src, el) {
      const ext = src.split('.').pop().toLowerCase();
      let media;
      if (VIDEO_EXTS.includes(ext)) {
        media = document.createElement('video');
        media.src = src;
        media.muted = true;
        media.loop = true;
        media.playsInline = true;
        media.setAttribute('playsinline', '');
        el.addEventListener('mouseenter', () => media.play().catch(() => {}));
        el.addEventListener('mouseleave', () => { media.pause(); media.currentTime = 0; });
      } else {
        media = document.createElement('img');
        media.src = src;
        media.alt = '';
        media.loading = 'lazy';
      }
      return media;
    }
  
    function buildScatter() {
      const hint = document.getElementById('mobile-hint');
      stage.innerHTML = '';
      if (hint) stage.appendChild(hint);
      rectElements = [];
      const W = stage.offsetWidth;
      const H = window.innerHeight * 0.92;
      stage.style.height = H + 'px';
      currentImages = assignImages();
      RECTS.forEach(function(r, i) {
        const el = document.createElement('div');
        el.className = 'rect-item';
        el.style.left   = (r.x / 100 * W) + 'px';
        el.style.top    = (r.y / 100 * H) + 'px';
        el.style.width  = (r.w / 100 * W * SIZE_SCALE) + 'px';
        el.style.height = (r.h / 100 * H * SIZE_SCALE) + 'px';
        const media = createMediaElement(currentImages[i], el);
        el.appendChild(media);
        stage.appendChild(el);
        rectElements.push(el);
      });
    }
  
    function swapImage(rectIndex, newSrc) {
      const el = rectElements[rectIndex];
      if (!el) return;
      const media = el.querySelector('img, video');
      if (!media) return;
      if (el.matches(':hover')) {
        const clone = media.cloneNode();
        clone.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:1;transition:opacity 0.6s ease;';
        el.appendChild(clone);
        media.src = newSrc;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          clone.style.opacity = '0';
          setTimeout(() => clone.parentNode && clone.parentNode.removeChild(clone), 700);
        }));
      } else {
        media.src = newSrc;
      }
      currentImages[rectIndex] = newSrc;
    }
  
    function startRotation() {
      setInterval(() => {
        if (MOODBOARD_IMAGES.length < 2) return;
        const indices = shuffle([...Array(RECTS.length).keys()]).slice(0, RECTS_PER_ROTATION);
        indices.forEach(idx => {
          const current = currentImages[idx];
          const pool = MOODBOARD_IMAGES.filter(src => src !== current);
          if (!pool.length) return;
          swapImage(idx, pool[Math.floor(Math.random() * pool.length)]);
        });
      }, ROTATION_INTERVAL);
    }

        }
      }, 80);
    }
  
    async function loadImagesFromCloudinary() {
  const base = `https://res.cloudinary.com/${CLOUDINARY_CLOUD}`;
  try {
    const [imgRes, vidRes] = await Promise.all([
      fetch(`${base}/image/list/moodboard.json`),
      fetch(`${base}/video/list/moodboard.json`)
    ]);

    const imgData = imgRes.ok ? await imgRes.json() : { resources: [] };
    const vidData = vidRes.ok ? await vidRes.json() : { resources: [] };

    const images = imgData.resources.map(r =>
      `${base}/image/upload/f_auto,q_auto,w_1200/${r.public_id}.${r.format}`
    );
    const videos = vidData.resources.map(r =>
      `${base}/video/upload/q_auto/${r.public_id}.${r.format}`
    );

    MOODBOARD_IMAGES = [...images, ...videos];
    if (!MOODBOARD_IMAGES.length) return;
    buildScatter();
    startRotation();
  } catch (err) {
    console.error('Erro Cloudinary:', err);
  }
}

    let touchStartX = 0;
let touchStartY = 0;
let isDrawing = false;

stage.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  isDrawing = false;
}, { passive: true });

stage.addEventListener('touchmove', function(e) {
  const touch = e.touches[0];
  const dx = Math.abs(touch.clientX - touchStartX);
  const dy = Math.abs(touch.clientY - touchStartY);

  // Se move mais horizontalmente ou em diagonal → é desenho
  if (!isDrawing && (dx > dy * 1.2 || dx > 10)) {
    isDrawing = true;
  }

  if (isDrawing) {
    e.preventDefault();
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const rect = el && el.closest('.rect-item');
    if (rect && !rect.classList.contains('touched')) {
      rect.classList.add('touched');
    }
  }
}, { passive: false });

stage.addEventListener('touchend', function() {
  document.querySelectorAll('.rect-item.touched').forEach(el => {
    setTimeout(() => el.classList.remove('touched'), 12000);
  });
  isDrawing = false;
});

  
    stage.addEventListener('mousemove', function(e) {
      let el = document.elementFromPoint(e.clientX, e.clientY);
      let rect = el && el.closest('.rect-item');
  
      if (!rect) {
        let minDist = Infinity;
        rectElements.forEach(function(r) {
          const box = r.getBoundingClientRect();
          const cx = box.left + box.width / 2;
          const cy = box.top + box.height / 2;
          const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
          if (dist < minDist && dist < 120) {
            minDist = dist;
            rect = r;
          }
        });
      }
  
      if (rect && !rect.classList.contains('hovered') && !rect.classList.contains('fading')) {
        rect.classList.add('hovered');
        rect.addEventListener('mouseleave', function onLeave() {
          rect.classList.remove('hovered');
          rect.classList.add('fading');
          setTimeout(() => rect.classList.remove('fading'), 5500);
          rect.removeEventListener('mouseleave', onLeave);
        });
      }
    });
