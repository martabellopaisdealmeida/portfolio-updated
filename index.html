    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
  
    function assignImages() {
      // Distribui imagens sem repetir até todas terem sido usadas
      const result = [];
      let pool = [];
      for (let i = 0; i < RECTS.length; i++) {
        if (pool.length === 0) pool = shuffle(MOODBOARD_IMAGES);
        result.push(pool.pop());
      }
      return result;
    }
  
    function createMediaElement(src, el) {
      const ext = src.split('.').pop().toLowerCase();
      let media;
      if (VIDEO_EXTS.includes(ext)) {
        media = document.createElement('video');
        media.src = src;
        media.muted = true;
        media.loop = true;
        media.autoplay = true;
        media.playsInline = true;
        media.setAttribute('playsinline', '');
        media.setAttribute('autoplay', '');
      } else {
        media = document.createElement('img');
        media.src = src;
        media.alt = '';
        media.loading = 'eager';
      }
      return media;
    }
  
    function buildScatter() {
      const hint = document.getElementById('mobile-hint');
      stage.innerHTML = '';
      if (hint) stage.appendChild(hint);
      rectElements = [];
      const W = stage.offsetWidth;
      const headerEl = document.querySelector('header');
const headerH = headerEl ? headerEl.offsetHeight : 0;
const H = window.innerWidth <= 768
  ? (window.innerHeight - headerH) * 1.35
  : window.innerHeight * 1.0;
      stage.style.height = H + 'px';
      currentImages = assignImages();
      RECTS.forEach(function(r, i) {
        const el = document.createElement('div');
        el.className = 'rect-item';
        el.style.left  = (r.x / 100 * W) + 'px';
        el.style.top   = (r.y / 100 * H) + 'px';
        el.style.width = (r.w / 100 * W * 0.6) + 'px';
        const media = createMediaElement(currentImages[i], el);
        el.appendChild(media);
        stage.appendChild(el);
        rectElements.push(el);
      });
    }
  
    function swapImage(rectIndex, newSrc) {
      const el = rectElements[rectIndex];
      if (!el) return;
      const media = el.querySelector('img, video');
      if (!media) return;
      // Troca silenciosa sempre — nunca mexer no DOM para não alterar z-index
      media.src = newSrc;
      currentImages[rectIndex] = newSrc;
    }
  
    function startRotation() {
      setInterval(() => {
        if (MOODBOARD_IMAGES.length < 2) return;
        const indices = shuffle([...Array(RECTS.length).keys()]).slice(0, RECTS_PER_ROTATION);
        indices.forEach(idx => {
          const current = currentImages[idx];
          // Não escolher imagens já visíveis noutros rects
          const visible = new Set(currentImages);
          const pool = MOODBOARD_IMAGES.filter(src => src !== current && !visible.has(src));
          // Se não houver opções sem repetição, aceita repetir (menos mal)
          const fallback = MOODBOARD_IMAGES.filter(src => src !== current);
          const chosen = pool.length ? pool : fallback;
          if (!chosen.length) return;
          swapImage(idx, chosen[Math.floor(Math.random() * chosen.length)]);
        });
      }, ROTATION_INTERVAL);
    }

    function loadImagesFromImageKit() {
      const base = `https://ik.imagekit.io/${IMAGEKIT_ID}/${IMAGEKIT_FOLDER}`;
      MOODBOARD_IMAGES = IMAGEKIT_FILES.map(filename => {

    let touchStartX = 0;
let touchStartY = 0;
let isDrawing = false;

stage.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  isDrawing = false;
}, { passive: true });

stage.addEventListener('touchmove', function(e) {
  const touch = e.touches[0];
  const dx = Math.abs(touch.clientX - touchStartX);
  const dy = Math.abs(touch.clientY - touchStartY);

  // Se move mais horizontalmente ou em diagonal → é desenho
  if (!isDrawing && (dx > dy * 1.2 || dx > 10)) {
    isDrawing = true;
  }

  if (isDrawing) {
    e.preventDefault();
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const rect = el && el.closest('.rect-item');
    if (rect && !rect.classList.contains('touched')) {
      rect.classList.add('touched');
    }
  }
}, { passive: false });

stage.addEventListener('touchend', function() {
  document.querySelectorAll('.rect-item.touched').forEach(el => {
    setTimeout(() => el.classList.remove('touched'), 16000);
  });
  isDrawing = false;
});

  
    stage.addEventListener('mousemove', function(e) {
      let el = document.elementFromPoint(e.clientX, e.clientY);
      let rect = el && el.closest('.rect-item');
  
      if (!rect) {
        let minDist = Infinity;
        rectElements.forEach(function(r) {
          const box = r.getBoundingClientRect();
          const cx = box.left + box.width / 2;
          const cy = box.top + box.height / 2;
          const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
          if (dist < minDist && dist < 60) {
            minDist = dist;
            rect = r;
          }
        });
      }
  
      if (rect && !rect.classList.contains('hovered')) {
        // Cancela qualquer fade/timer anterior neste rect
        if (rect._fadeTimer) { clearTimeout(rect._fadeTimer); rect._fadeTimer = null; }
        rect.classList.remove('fading');
        rect.classList.add('hovered');

        rect.addEventListener('mouseleave', function onLeave() {
          rect.classList.remove('hovered');
          rect.removeEventListener('mouseleave', onLeave);

          // fade-out igual para imagens e vídeos
          rect.classList.add('fading');
          rect._fadeTimer = setTimeout(() => {
            rect.classList.remove('fading');
            rect._fadeTimer = null;
          }, 9000);
        });
      }
    });
