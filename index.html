<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="index.css">

  <link rel="stylesheet" href="search.css">
  <link rel="stylesheet" href="custom-cursor.css">
  <link rel="icon" type="image/x-icon" href="favicon.png">

  <style>
    /* ── PP Neue Montreal font faces ───────────────────────── */
    @font-face {
      font-family: 'PPNeueMontreal';
      src: url('fonts/PPNeueMontreal-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'PPNeueMontreal';
      src: url('fonts/PPNeueMontreal-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'PPNeueMontreal';
      src: url('fonts/PPNeueMontreal-Italic.otf') format('opentype');
      font-weight: 400;
      font-style: italic;
      font-display: block;
    }

    /* ── Header reset ──────────────────────────────────────── */
    header {
      padding: 28px 40px;
      position: sticky;
      top: 0;
      background-color: transparent;
      z-index: 100;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start; /* aligns tops so stacked left matches right icons */
    }

    /* ── Left block: logo row + nav stacked ──────────────── */
    .header-left {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    /* "marta" + toggle on the same line */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-link {
      text-decoration: none;
      line-height: 1.2;
    }

    .logo-text {
      font-family: 'PPNeueMontreal', sans-serif;
      font-weight: 500;
      font-style: normal;
      font-size: 17px;
      color: #111;
      letter-spacing: -0.01em;
    }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .desktop-nav a {
      font-family: 'PPNeueMontreal', sans-serif;
      font-weight: 500;
      font-size: 17px;
      color: #111;
      text-decoration: none;
      letter-spacing: -0.01em;
      line-height: 1.2;
      /* no extra margin — comma + single space in HTML is enough */
    }

    /* active = italic */
    .desktop-nav a.active {
      font-style: italic;
    }

    /* ── Right block: search only ─────────────────────────── */
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-top: 2px;
    }

    /* Theme toggle inside logo-row */
    .theme-toggle {
      display: flex;
      align-items: center;
    }

    /* Search icon button */
    .search-container {
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .search-icon-svg {
      display: block;
      width: 20px;
      height: 20px;
      color: #111;
      transition: opacity 0.15s ease;
    }

    .search-container:hover .search-icon-svg {
      opacity: 0.5;
    }

    /* ── Toggle: outline/stroke only ─────────────────────── */
    .toggle-switch {
      position: relative;
      width: 34px;
      height: 20px;
      background-color: transparent !important;
      border: 1.5px solid #111 !important;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.3s ease;
    }
    .toggle-slider {
      position: absolute;
      top: 50%;
      left: 2px;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      background-color: transparent !important;
      border: 1.5px solid #111 !important;
      border-radius: 50%;
      box-shadow: none !important;
      transition: left 0.3s ease, border-color 0.3s ease;
    }
    body.dark-mode .toggle-switch {
      border-color: #ffffff !important;
    }
    body.dark-mode .toggle-slider {
      border-color: #ffffff !important;
      left: calc(100% - 16px);
      transform: translateY(-50%);
    }

    /* ── Dark mode overrides ─────────────────────────────── */
    body.dark-mode .logo-text,
    body.dark-mode .desktop-nav a {
      color: #ffffff;
    }

    body.dark-mode .search-icon-svg {
      color: #ffffff;
    }

    /* ── Mobile ────────────────────────────────────────────── */
    @media (max-width: 768px) {
      header {
        padding: 20px 24px;
      }

      .logo-text,
      .desktop-nav a {
        font-size: 15px;
      }

      .header-right {
        gap: 12px;
      }

      .search-icon-svg {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>
<body>
