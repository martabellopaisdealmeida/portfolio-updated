        el.classList.remove('fading');
        el.classList.add('hovered');

      el.addEventListener('pointerleave', function () {
        el.classList.remove('hovered');
        el.classList.add('fading');

          el.classList.remove('fading');
        }, HOVER_FADE_MS);
      });

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
  
    // A "deck" yields items one at a time, reshuffling after a full pass so every
    // item is shown once per cycle before any repeats.
    function makeDeck(items) {
      let order = shuffle(items), pos = 0;
      return function () {
        if (!order.length) return null;
        if (pos >= order.length) { order = shuffle(items); pos = 0; }
        return order[pos++];
      };
    }

    // Build one full board's worth of sources: a capped, random set of video
    // tiles, the rest images — all drawn from the decks so successive pages
    // advance through the whole library.
    function nextPageSources() {
      const n = RECTS.length;
      const videoCount = nextVideo ? Math.min(MAX_VIDEOS, n) : 0;
      const videoSlots = new Set(shuffle([...Array(n).keys()]).slice(0, videoCount));
      return RECTS.map((_, i) => (videoSlots.has(i) && nextVideo) ? nextVideo() : nextImage());
    }
  
    function createMediaElement(src, el) {
      let media;
      if (isVideo(src)) {
        media = document.createElement('video');
        media.muted = true;
        media.loop = true;
        media.autoplay = true;
        media.playsInline = true;
        media.setAttribute('playsinline', '');
        media.setAttribute('autoplay', '');
        media.src = src;
      } else {
        media = document.createElement('img');
        media.alt = '';
        media.loading = 'eager';
        media.decoding = 'async';
        media.dataset.full = src;
        // If the resizer proxy fails, fall back to the original file.
        media.onerror = function () {
          if (media.src !== media.dataset.full) { media.onerror = null; media.src = media.dataset.full; }
        };
        media.src = displaySrc(src);
      }
      // When this tile finishes fading back to hidden, apply any queued source.
      media.addEventListener('transitionend', function (e) {
        if (e.propertyName === 'opacity') applyPendingIfHidden(el);
      });
      return media;
    }
  
    function buildScatter(sources) {
      const hint = document.getElementById('mobile-hint');
      stage.innerHTML = '';
      if (hint) stage.appendChild(hint);
      rectElements = [];
      // Recompute per build so resizing / moving to another screen re-evaluates.
      const isDesktop = window.innerWidth > 768;
      const sizeScale = isDesktop ? 1.03 : 1.80;
      const W = stage.offsetWidth;
      const headerEl = document.querySelector('header');
const headerH = headerEl ? headerEl.offsetHeight : 0;
const footerEl = document.querySelector('footer');
const footerH = footerEl ? footerEl.offsetHeight : 0;
// Both mobile and desktop fill exactly the space left between header and footer,
// so the whole page fits in one viewport with no scroll.
const H = window.innerHeight - headerH - footerH;
      stage.style.height = H + 'px';
      currentImages = sources || nextPageSources();
      // RECTS only span ~1.5%–55% vertically. Normalize the row positions so the
      // top row sits at the top edge and the bottom row reaches the bottom edge,
      // filling the whole board (no empty band above the footer).
      const yTops = RECTS.map(function (r) { return r.y; });
      const yMin = Math.min.apply(null, yTops);
      const yMax = Math.max.apply(null, yTops);
      const ySpan = (yMax - yMin) || 1;
      RECTS.forEach(function(r, i) {
        const el = document.createElement('div');
        el.className = 'rect-item';
        el._idx = i;
        // Desktop sizes both dimensions from the width so the item's aspect ratio
        // stays constant on any screen (otherwise wide screens stretch the boxes
        // and object-fit:contain leaves big gaps around the images).
        const drawnW = (r.w / 100 * W * sizeScale);
        const drawnH = isDesktop
          ? (r.h / 100 * W * sizeScale)
          : (r.h / 100 * H * sizeScale);
        el.style.left   = (r.x / 100 * W) + 'px';
        el.style.top    = (((r.y - yMin) / ySpan) * (H - drawnH)) + 'px';
        el.style.width  = drawnW + 'px';
        el.style.height = drawnH + 'px';
        const media = createMediaElement(currentImages[i], el);
        el.appendChild(media);
        if (isDesktop) attachHover(el);
        stage.appendChild(el);
        rectElements.push(el);
      });
    }
  
    // A tile is "busy" while it's revealed or still fading — its image is (or is
    // becoming) visible, so we must not change it underneath the visitor.
    function isTileBusy(el) {
      return el.classList.contains('hovered')
        || el.classList.contains('touched')
        || el.classList.contains('fading');
    }

    // Point a tile at a new source, rebuilding the element only if the media type
    // changed (image ⇄ video). Invisible while hidden, so the change isn't seen.
    function setTileSource(el, src) {
      const existing = el.querySelector('img, video');
      const sameType = existing && ((existing.tagName === 'VIDEO') === isVideo(src));
      if (sameType) {
        if (existing.tagName === 'IMG') existing.dataset.full = src;
        existing.src = displaySrc(src);
      } else {
        const media = createMediaElement(src, el);
        if (existing) el.replaceChild(media, existing);
        else el.appendChild(media);
      }
      currentImages[el._idx] = src;
    }

    // Called when a tile finishes fading out: if a new source was queued while it
    // was visible, apply it now that it's hidden again.
    function applyPendingIfHidden(el) {
      const src = el._pendingSrc;
      if (!src) return;
      if (el.classList.contains('hovered') || el.classList.contains('touched')) return;
      el._pendingSrc = null;
      setTileSource(el, src);
    }

    // Swap the whole hidden pool to the next set. Fully-hidden tiles change now;
    // tiles still visible (revealed or fading) keep their image and update
    // silently the moment they finish fading out — so nothing morphs on screen.
    function flipPage() {
      const sources = nextPageSources();
      sources.forEach((src, i) => {
        const el = rectElements[i];
        if (!el || !src) return;
        if (isTileBusy(el)) { el._pendingSrc = src; return; }
        el._pendingSrc = null;
        setTileSource(el, src);
      });
    }
  
    function startPaging() {
      setInterval(() => {
        if (MOODBOARD_IMAGES.length < 2) return;
        flipPage();
      }, PAGE_INTERVAL);
    }
  
    // Typewriter hint (mobile only)
    if (window.innerWidth <= 768) {
      const hint = document.getElementById('mobile-hint');
      const textEl = hint.querySelector('.typewriter-text');
      const message = 'scratch for a surprise :)';
      let i = 0;
      const type = setInterval(() => {
        textEl.textContent += message[i++];
        if (i >= message.length) {
          clearInterval(type);
          setTimeout(() => {
            hint.style.transition = 'opacity 1.2s ease';
            hint.style.opacity = '0';
            setTimeout(() => hint.remove(), 1200);
          }, 5000);
        }
      }, 80);
    }

    let touchStartX = 0;
let touchStartY = 0;
let isDrawing = false;

stage.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  isDrawing = false;
}, { passive: true });

stage.addEventListener('touchmove', function(e) {
  const touch = e.touches[0];
  const dx = Math.abs(touch.clientX - touchStartX);
  const dy = Math.abs(touch.clientY - touchStartY);

  // Se move mais horizontalmente ou em diagonal → é desenho
  if (!isDrawing && (dx > dy * 1.2 || dx > 10)) {
    isDrawing = true;
  }

  if (isDrawing) {
    e.preventDefault();
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const rect = el && el.closest('.rect-item');
    if (rect && !rect.classList.contains('touched')) {
      // Start the fade timer the moment the image appears (not on touch release).
      clearTimeout(rect._fadeTimer);
      rect.classList.remove('fading');
      rect.classList.add('touched');
      rect._fadeTimer = setTimeout(function () {
        rect.classList.remove('touched');
        rect.classList.add('fading');       // smooth fade-out instead of an instant pop
        rect._fadeTimer = setTimeout(function () {
          rect.classList.remove('fading');
        }, 3000);
      }, 5000);
    }
  }
}, { passive: false });

stage.addEventListener('touchend', function() {
  isDrawing = false;
});
