  <script>
    // Load moodboard images from GitHub Contents API
    const GITHUB_USER = 'martabellopaisdealmeida';
    const GITHUB_REPO = 'portfolio-updated';
    const MOODBOARD_PATH = 'inspo';

    const moodboard = document.getElementById('moodboard');
    const loading = document.getElementById('moodboard-loading');

    async function loadMoodboard() {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${MOODBOARD_PATH}`
        );
        if (!res.ok) throw new Error('API error');
        const files = await res.json();

        const images = files.filter(f =>
          /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(f.name)
        );

        loading.style.display = 'none';

        images.forEach(file => {
          const item = document.createElement('div');
          item.className = 'moodboard-item';

          const caption = formatCaption(file.name);

          item.innerHTML = `
            <img
              src="${file.download_url}"
              alt="${caption.code}"
              loading="lazy"
            >
            <div class="moodboard-caption">
              <span class="caption-code">${caption.code}</span>
              <span class="caption-src">SRC</span>
            </div>
          `;

          moodboard.appendChild(item);
        });

      } catch (err) {
        loading.textContent = 'erro ao carregar imagens.';
        console.error('Moodboard load error:', err);
      }
    }

    // Format filename into a display code
    // e.g. "001_dijkstra.jpg" → { code: "001 · dijkstra" }
    function formatCaption(filename) {
      const base = filename.replace(/\.[^.]+$/, ''); // remove extension
      const clean = base.replace(/[-_]/g, ' ').toLowerCase();
      return { code: clean };
    }

    loadMoodboard();
  </script>
