  <script src="script.js"></script>

  <script>
        const CLOUD_NAME = 'dqfvvnjlj';
      const TAG = 'inspo';

      const moodboard = document.getElementById('moodboard');
      const loading = document.getElementById('moodboard-loading');

      async function loadMoodboard() {
        try {
          const res = await fetch(
            `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG}.json`
          );
          if (!res.ok) throw new Error('API error');
          const data = await res.json();

          loading.style.display = 'none';

          data.resources.forEach(file => {
            const item = document.createElement('div');
            item.className = 'moodboard-item';

            const caption = formatCaption(file.public_id);
            const url = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${file.public_id}`;

            item.innerHTML = `
              <img
                src="${url}"
                alt="${caption}"
                loading="lazy"
              >
              <div class="moodboard-caption">
                <span class="caption-code">${caption}</span>
                <span class="caption-src">SRC</span>
              </div>
            `;

            moodboard.appendChild(item);
          });

        } catch (err) {
          loading.textContent = 'erro ao carregar imagens.';
          console.error('Moodboard load error:', err);
        }
      }

      function formatCaption(publicId) {
        const name = publicId.split('/').pop();
        return name.replace(/[-_]/g, ' ').toLowerCase();
      }

      loadMoodboard();
  </script>

  <script>
    /* View toggle — mobile only */
    const viewBtns = document.querySelectorAll('.view-btn');
    const moodboardEl = document.getElementById('moodboard');
    viewBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        viewBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const cols = btn.dataset.cols;
        moodboardEl.dataset.cols = cols;
      });
    });
  </script>
