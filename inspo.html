  <script src="script.js"></script>

  <script>
    const OWNER = 'martabellopaisdealmeida';
    const REPO  = 'portfolio-updated';
    const FOLDER = 'inspo';

    const moodboard = document.getElementById('moodboard');
    const loading   = document.getElementById('moodboard-loading');

    async function loadMoodboard() {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`,
          { headers: { 'Accept': 'application/vnd.github.v3+json' } }
        );
        if (!res.ok) throw new Error('API error');
        const files = await res.json();

        const images = files.filter(f =>
          /\.(jpe?g|png|gif|webp|avif)$/i.test(f.name)
        );

        loading.style.display = 'none';

        images.forEach(file => {
          const item = document.createElement('div');
          item.className = 'moodboard-item';

          const caption = formatCaption(file.name);
          const url = file.download_url;

          item.innerHTML = `
            <img src="${url}" alt="${caption}" loading="lazy">
            <div class="moodboard-caption">
              <span class="caption-code">${caption}</span>
              <span class="caption-src">SRC</span>
            </div>
          `;

          moodboard.appendChild(item);
        });

      } catch (err) {
        loading.textContent = 'erro ao carregar imagens.';
        console.error('Moodboard load error:', err);
      }
    }

    function formatCaption(filename) {
      return filename
        .replace(/\.[^.]+$/, '')   /* remove extensão */
        .replace(/[-_]/g, ' ')
        .toLowerCase();
    }

    loadMoodboard();
  </script>
